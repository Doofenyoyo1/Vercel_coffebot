<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coffee Bot – test</title>
  <style>
    :root {
      --bg: #f6f1ea; --card: #fffdf9; --text: #2b211a; --muted: #7a6a5c;
      --line: #e4d8ca; --accent: #c8763b; --accent-text: #fff;
      --ok: #2f7d4f; --err: #b23b2e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1612; --card: #251e18; --text: #f1e7dc; --muted: #a8988a;
        --line: #3a2f26; --accent: #d98a4f; --accent-text: #1b1612;
        --ok: #6fc28f; --err: #ef7d6f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: 100%; max-width: 440px; background: var(--card);
      border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p.lead { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
    .hint { font-weight: 400; color: var(--muted); }
    input, textarea {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      width: 100%; margin-top: 20px; padding: 12px; font: inherit; font-weight: 700;
      color: var(--accent-text); background: var(--accent); border: 0;
      border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin: 14px 0 0; min-height: 1.5em; font-size: .95rem; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <h1>☕ Test powiadomień</h1>
    <p class="lead">Wyślij próbne wsparcie na kanał Discord.</p>

    <form id="form">
      <label for="secret">Sekret <span class="hint">(WEBHOOK_SECRET z Vercela)</span></label>
      <input id="secret" type="password" autocomplete="off" required>

      <label for="name">Imię</label>
      <input id="name" value="Test">

      <div class="row">
        <div>
          <label for="amount">Kwota</label>
          <input id="amount" type="number" min="0" step="0.01" value="14">
        </div>
        <div>
          <label for="currency">Waluta</label>
          <input id="currency" value="zł">
        </div>
      </div>

      <label for="message">Wiadomość</label>
      <textarea id="message">Działa! 🎉</textarea>

      <button id="send" type="submit">Wyślij test</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = $('status');

    const messages = {
      401: 'Zły sekret – sprawdź WEBHOOK_SECRET na Vercelu.',
      404: 'Nie znaleziono endpointu – sprawdź, czy wdrożenie się udało.',
      500: 'Błąd serwera – najczęściej brak DISCORD_WEBHOOK_URL albo nie zrobiono redeploy.',
    };

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('send');
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Wysyłanie…';

      try {
        const res = await fetch('/api/webhook/generic', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-webhook-secret': $('secret').value,
          },
          body: JSON.stringify({
            id: 'test-' + Date.now(),
            name: $('name').value,
            amount: $('amount').value ? Number($('amount').value) : undefined,
            currency: $('currency').value,
            message: $('message').value,
          }),
        });

        if (res.ok) {
          status.className = 'ok';
          status.textContent = '✔ Wysłano – sprawdź kanał na Discordzie.';
        } else {
          status.className = 'err';
          status.textContent = messages[res.status] || `Błąd ${res.status}`;
        }
      } catch (err) {
        status.className = 'err';
        status.textContent = 'Brak połączenia: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
